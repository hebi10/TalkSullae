<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>톡술래 — 1-A UI 디자인 시안</title>
<style>

row{flex:1;min-width:0}.wbold{font-weight:800}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);font-size:15px;font-weight:800;border:0;border-radius:9px;padding:13px 15px;min-height:48px;text-align:center;white-space:nowrap}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid #53565e}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--stroke)}.btn.tiny{font-size:13px;min-height:48px;padding:11px 12px}.btn.full{display:flex;width:100%}.tag{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);color:var(--muted);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:700}.tag.white{background:var(--primary);color:var(--on-primary)}.tag.good{color:var(--success)}.tag.warn{color:var(--warning)}.tag.err{color:var(--error)}.divider{border:0;border-top:1px solid var(--stroke);margin:15px 0}.field{border:1px solid var(--stroke);background:var(--surface);padding:14px;min-height:52px;border-radius:9px;color:var(--text);font-size:15px}.field.placeholder{color:var(--muted)}.label{font-size:13px;font-weight:800;margin:0 0 8px}.foot{padding:12px 17px 18px;flex-shrink:0;background:var(--bg);box-shadow:none}.tabs{display:flex;flex-shrink:0;gap:0;padding:0 17px;border-bottom:1px solid var(--stroke)}.tab{flex:1;text-align:center;min-height:48px;padding:14px 2px;color:var(--muted);font-size:14px;font-weight:700}.tab.active{color:var(--text);border-bottom:2px solid #fafafa}.bottom{height:65px;padding:7px 10px 11px;border-top:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-around;flex-shrink:0}.nav{flex:1;text-align:center;color:var(--muted);font-size:12px}.nav b{display:block;font-size:21px;line-height:27px;font-weight:600}.nav.active{color:var(--text);font-weight:800}.gesture{height:17px;flex-shrink:0;display:grid;place-items:center}.gesture i{width:94px;height:4px;background:#d2d4d6;border-radius:8px}.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--stroke);border-radius:9px;padding:7px 11px;font-size:12px;color:var(--muted)}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:var(--surface);border:1px solid var(--stroke);border-radius:8px;padding:13px 10px;text-align:center}.metric strong{display:block;font-size:22px;font-weight:900;letter-spacing:-.5px}.metric small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.avatarline{display:flex;gap:6px;flex-wrap:wrap}.dot{width:6px;height:6px;border-radius:50%;background:#8c9099;display:inline-block}.dot.online{background:var(--success)}.progress{height:7px;background:#34363d;border-radius:10px;overflow:hidden}.progress i{height:100%;background:#f1f2f3;display:block}.list{display:flex;flex-direction:column;gap:12px}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #27292f}.item:last-child{border:0}.split{display:flex;gap:10px}.split>.btn{flex:1}.chat{display:flex;flex-direction:column;gap:17px}.message{display:flex;gap:9px;align-items:flex-start}.message.mine{flex-direction:row-reverse}.message .inner{max-width:83%}.message .sender{font-size:13px;font-weight:800;color:#e5e6e8;margin:0 0 7px}.message.mine .sender{text-align:right}.bubble{padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:15px;line-height:1.55;letter-spacing:-.2px}.message.mine .bubble{background:#eeeef0;color:#151619}.message .time{font-size:12px;color:var(--muted);margin-top:4px}.message.mine .time{text-align:right}.composer{display:flex;gap:9px;align-items:center;padding:9px 16px 8px;border-top:1px solid var(--stroke)}.composer .field{flex:1;min-height:45px;padding:13px 10px}.titleblock{margin:6px 0 24px}.titleblock .subline{color:var(--muted);font-size:13px;line-height:1.55;margin-top:7px}.choice{display:flex;gap:11px;align-items:center;padding:13px;border:1px solid var(--stroke);border-radius:9px;background:var(--surface);margin-bottom:9px;min-height:57px}.choice.selected{border-color:#c9cbcf;background:#303238}.radio{border:2px solid #8a8c93;border-radius:50%;width:20px;height:20px;flex-shrink:0;display:grid;place-items:center}.choice.selected .radio{border-color:#f3f3f4}.choice.selected .radio:after{content:"";width:9px;height:9px;background:#f3f3f4;border-radius:50%}.rank{width:28px;text-align:center;font-size:17px;font-weight:900;color:var(--muted)}.hero{padding:19px;background:#23252a;border:1px solid #51545b;border-radius:10px;margin-bottom:17px}.hero-mask{filter:grayscale(1);display:inline-grid;place-items:center;background:#3d3f45;border-radius:12px;height:64px;width:64px;font-size:40px}.index{font-size:11px;color:#a5a7ac;letter-spacing:1.7px;font-weight:800}.spacer{height:14px}.timeline{padding-left:20px;border-left:2px solid #505259;margin-left:7px}.timepoint{position:relative;margin:0 0 20px;padding-left:18px}.timepoint:before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:#f5f5f5;border:3px solid var(--bg)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}.game-icon{filter:grayscale(1);width:48px;height:48px;background:#303238;border:1px solid #474b52;display:grid;place-items:center;border-radius:10px;font-size:28px}.standout{font-size:40px;line-height:1.3;font-weight:900}.gamebanner{margin-bottom:16px;background:var(--surface2);padding:15px;border-radius:9px;border:1px solid #555860}.line{height:1px;background:#35373c;margin:13px 0}.note{background:#24262b;padding:13px;border-radius:9px;font-size:13px;line-height:1.6;color:#d3d4d7}.swatch{width:38px;height:38px;border-radius:7px;border:1px solid #696c72;display:inline-block}.wcenter{display:grid;place-items:center}.mt10{margin-top:10px}.mt18{margin-top:18px}.mt26{margin-top:26px}.mb12{margin-bottom:12px}.narrow{max-width:500px;margin:auto}.halftab{width:50%}.light:root,.light{--bg:#f7f7f8;--surface:#fff;--surface2:#edf0f2;--stroke:#d5d8dc;--text:#1b1d20;--muted:#636870;--primary:#1b1d20;--on-primary:#fff;color-scheme:light}.light .tag.white{background:#18191c;color:#fff}.light .bubble{background:#e8ebee}.light .message.mine .bubble{background:#25272c;color:#fff}.light .message .sender{color:#26282d}.light .foot{box-shadow:none}.light .status{color:#161719}.light .hero{background:#e9eaec;border-color:#d0d2d6}.light .tag{background:#ebedf0}.light .avatar{background:#eceef1}.wideLayout{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1;min-height:0;height:auto}@media(max-width:700px){.wideLayout{grid-template-columns:180px minmax(0,1fr)}}.wideSide{border-right:1px solid var(--stroke);padding:16px}.wideMain{display:flex;flex-direction:column;min-height:0}
 .match-row{min-height:68px}.match-pick{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-height:48px;min-width:75px;padding:0 8px;background:var(--surface2);border-radius:7px;font-size:14px}.match-confirm{color:var(--success);font-size:19px;font-weight:800;flex-shrink:0}.light .note{background:#e9ebee;color:#383c43}.light .message.mine .sender{color:#26282d}
.composer-add{display:grid;place-items:center;font-size:24px;min-width:48px;min-height:48px;flex-shrink:0}@media(max-width:390px){.game-card-actions{flex-wrap:wrap;justify-content:flex-end}} 
</style></head>
<body><main id="app" class="app"></main>
<script>
const avatars={"민지":"🐱","지훈":"🐶","수빈":"🐰","도윤":"🐻","현우":"🐼","서연":"🦊","나":"🦉","예진":"🐧","고양이":"🐱","토끼":"🐰","부엉이":"🦉","강아지":"🐶","여우":"🦊"};
const av=(name,cl='')=>`<span class="avatar ${cl}">${avatars[name]||'🎭'}</span>`;
const btn=(s,cl='')=>`<div class="btn ${cl}">${s}</div>`;
const tag=(s,c='')=>`<span class="tag ${c}">${s}</span>`;
const line=(a,b='',c='')=>`<div class="item">${a}<div class="grow">${b}</div>${c}</div>`;
const card=(c,cl='')=>`<div class="card ${cl}">${c}</div>`;
const sec=(s,b)=>`<div class="section"><h3 class="ttl">${s}</h3>${b}</div>`;
const head=(title,sub='',icons='⋮',back='←')=>`<div class="top"><span class="lead">${back}</span><div class="head"><div class="h">${title}</div>${sub?`<div class="sub">${sub}</div>`:''}</div><span class="act">${icons}</span></div>`;
const status=()=>`<div class="status"><span>9:41</span><span>◆ ▰ ▣ 100%</span></div>`;
const gesture=()=>`<div class="gesture"><i></i></div>`;
const tabs=(active)=>`<div class="tabs">${['채팅','게임','기록'].map(x=>`<div class="tab ${x===active?'active':''}">${x}</div>`).join('')}</div>`;
const bottom=(active)=>`<div class="bottom">${[['내 방','▣'],['기록','▥'],['마이','◉']].map(([a,i])=>`<div class="nav ${active===a?'active':''}"><b>${i}</b>${a}</div>`).join('')}</div>`;
const foot=(text,cl='')=>`<div class="foot">${btn(text,'full '+cl)}</div>`;
const title=(a,b='')=>`<div class="titleblock"><div class="display">${a}</div>${b?`<div class="subline">${b}</div>`:''}</div>`;
const message=(n,c,time='오후 8:14',mine=false)=>`<div class="message ${mine?'mine':''}">${av(n,'sm')}<div class="inner"><div class="sender">${mine?'나 · '+n:n}</div><div class="bubble">${c}</div><div class="time">${time}</div></div></div>`;
const composer=(anonymous=false)=>`<div class="composer"><span class="composer-add" aria-label="추가 메뉴">＋</span><div class="field placeholder">${anonymous?'익명으로 메시지 보내기':'메시지 입력하기'}</div>${btn('➤','tiny')}</div>`;
const render=(h,b,lower='',opts={})=>{const tab=lower.startsWith('<div class="tabs">')?lower:'';const f=tab?'':lower;return `${status()}${h}${tab}<div class="body">${b}</div>${f}${gesture()}`;};
const gameHeader=(name='너 누구야?',sub='ROUND 1 · 익명 채팅',left='←')=>head(name,sub,`<span class="pill">◷ 02:35</span>`,left);
const gameTag=(s)=>`<span class="pill">${s}</span>`;
const roomRow=(name,members,last,emoji,unread='')=>card(`<div class="row"><div class="avatar icon">${emoji}</div><div class="grow"><div class="row between"><strong>${name}</strong>${unread?tag(unread,'white'):''}</div><div class="mini mt10">${members}명 · ${last}</div></div><b class="muted">›</b></div>`);
const ordinaryChat=()=>`${card(`<div class="row">${av('민지','sm')}<div class="grow"><strong>너 누구야?</strong><div class="mini mt10">ROUND 2 · 익명 채팅 중 · 02:35 남음</div></div>${btn('참여','tiny')}</div>`,'soft')}<div class="mini center mb12">오늘 · 11월 10일</div><div class="chat">${message('민지','다들 왔네! 오늘 뭐 할까?')}${message('지훈','오랜만에 너 누구야? 하자.','오후 8:15')}${message('수빈','좋아! 이번에는 정체 절대 안 들킴','오후 8:16')}${message('도윤','ㅋㅋㅋ 말투부터 너무 티 나는데?','오후 8:17')}${message('나','일단 준비 완료!','오후 8:18',true)}${message('민지','다들 준비되면 시작할게!','오후 8:19')}</div>`;
const chatGame=()=>`${card(`<div class="mini">오늘의 주제</div><div class="large mt10" style="font-size:18px">친구 중 무인도에서 가장 오래 살아남을 사람은?</div>`,'soft')}<div class="row between mb12">${gameTag('익명 참가자 5명')}${tag('내 정체: 부엉이','white')}</div><div class="chat">${message('고양이','무조건 난 살아남음')}${message('토끼','너 요리도 못 하잖아','오후 8:15')}${message('부엉이','일단 나무부터 구해야 하는 거 아냐?','오후 8:16',true)}${message('강아지','난 물부터 확보할 거야','오후 8:17')}${message('여우','식량부터 확보해야지 ㅋㅋ','오후 8:18')}</div>`;
const sides=[['고양이','민지','🐱'],['토끼','지훈','🐰'],['강아지','수빈','🐶'],['여우','도윤','🦊']];
const match=(a,b,i)=>`<div class="choice match-row"><span class="avatar sm">${a==='고양이'?'🐱':a==='토끼'?'🐰':a==='강아지'?'🐶':'🦊'}</span><div class="grow"><div class="mini">익명 ${i+1}</div><strong>${a}</strong></div><span class="muted">→</span><span class="match-pick">${b} ▾</span><span class="match-confirm" aria-label="선택 완료">✓</span></div>`;
const scores=()=>card(`<div class="row between"><div><div class="mini">내 획득 점수</div><div class="display">+320<span style="font-size:14px">점</span></div></div><div><div class="mini">현재 시즌 점수</div><div class="large">1,240점</div></div></div><div class="mini mt18">정체 적중 3명 × 100점 = 300점 · 위장 보너스 20점</div>`);
const gameRow=(emoji,name,desc,time,min)=>card(`<div class="row"><div class="game-icon">${emoji}</div><div class="grow"><strong>${name}</strong><div class="mini mt10">${desc}</div></div></div><div class="row between mt18"><div class="mini">${min}명 · ${time}</div><div class="row game-card-actions">${btn('규칙 보기','tiny secondary')}${btn('대기실 만들기','tiny')}</div></div>`);
const screens={};
screens.S01=()=>`${status()}<div class="body wcenter"><div class="narrow center"><div class="hero-mask" style="height:105px;width:105px;font-size:60px;margin:auto">🎭</div><div class="display mt26" style="font-size:38px">톡술래</div><div class="mt10 muted">말투를 숨겨라, 친구를 찾아라</div><div class="spacer"></div><div class="spacer"></div><div class="mini">채팅으로 즐기는 친구들의 추리 게임</div></div></div><div class="foot"><div class="mini center">새로운 대화, 새로운 술래</div></div>${gesture()}`;
screens.S02=()=>`${status()}${head('환영합니다','','','')}<div class="body"><div class="wcenter" style="height:160px"><div class="hero-mask">🎭</div></div>${title('친구들과 채팅하고,\n서로의 정체를 맞혀보세요.','같은 방에서 익명 채팅과 여러 심리게임을 즐기고 기록을 쌓아보세요.')}<div class="section">${line('<div class="game-icon">💬</div>','<strong>평소에는 채팅</strong><div class="mini mt10">친구들과 자유롭게 대화해요.</div>')}${line('<div class="game-icon">🎭</div>','<strong>게임할 때는 익명</strong><div class="mini mt10">말투만으로 정체를 알아보세요.</div>')}${line('<div class="game-icon">🏆</div>','<strong>우리만의 기록</strong><div class="mini mt10">승패와 업적이 방에 쌓여요.</div>')}</div><div class="note">로그인 후 이용약관 동의를 확인합니다. 개인정보처리방침은 언제든 확인할 수 있습니다.</div></div><div class="foot">${btn('G  Google 계정으로 시작하기','full')}<div class="mini center mt10">이용약관 · 개인정보처리방침</div></div>${gesture()}`;
screens.S03=()=>render(head('내 방','함께한 친구와 게임이 기다리고 있어요','＋'),`${title('다시 만나서 반가워요','진행 중인 게임이 있으면 바로 이어서 참여하세요.')}${sec('참여 중인 방',roomRow('금요일 게임방',6,'너 누구야? 진행 중','🎭','3')+roomRow('대학 동기 모임',8,'지훈: 토요일에 모일래?','🎓','1')+roomRow('고등학교 친구들',5,'수빈: 다들 잘 지내?','🐾'))}${card(`<div class="row"><span class="avatar icon">＋</span><div class="grow"><strong>새 방 만들기</strong><div class="mini mt10">새로운 친구들과 함께 시작</div></div><b>›</b></div>`)}<div class="mini center mt26">초대 코드를 받으셨나요?　<u>코드 입력</u></div>`,bottom('내 방'));
screens.S04=()=>render(head('새 방 만들기','친구들과 사용할 공간을 만들어요'),`${title('우리만의 채팅방','방을 만들면 언제든 친구를 초대해 게임할 수 있어요.')}${card(`<div class="center"><div class="hero-mask" style="margin:auto">🎭</div><div class="mini mt10">방 아이콘 변경</div></div>`)}<div class="section"><div class="label">방 이름 <span class="muted">(필수)</span></div><div class="field">금요일 게임방</div><div class="mini mt10" style="text-align:right">8 / 24</div></div><div class="section"><div class="label">방 설명 <span class="muted">(선택)</span></div><div class="field placeholder">우리 모임을 소개해 주세요</div></div>${sec('참여 설정',card(`<div class="row between"><div><strong>방장 가입 승인</strong><div class="mini mt10">방장이 확인한 친구만 입장할 수 있어요</div></div>${tag('켜짐','white')}</div><div class="line"></div><div class="row between"><strong>최대 멤버 수</strong><span>20명　⌄</span></div>`))}<div class="note">방을 생성한 사용자가 방장이 되며, 멤버 초대·강퇴 권한을 가집니다.</div>`,foot('방 만들기'));
