<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>톡술래 1-C — 상태별 디자인 시안</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Roboto,'Noto Sans KR','Malgun Gothic',sans-serif}body{background:#101114;color:#f4f4f5}.device{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;--bg:#101114;--panel:#1d1f23;--panel2:#272a30;--txt:#f4f4f5;--sub:#adb0b7;--line:#393c43;--action:#f5f6f7;--actiontxt:#151619;background:var(--bg);color:var(--txt)}.status{display:flex;align-items:center;justify-content:space-between;min-height:30px;padding:6px 18px 0;font-size:13px;font-weight:600;flex-shrink:0}.top{display:flex;align-items:center;gap:12px;min-height:70px;padding:7px 18px 9px;flex-shrink:0}.navback{font-size:27px;min-width:48px;min-height:48px;display:flex;align-items:center}.name{font-size:22px;font-weight:750;flex:1}.roundicon{width:44px;height:44px;background:#292c31;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:20px}.meta{font-size:12px;color:var(--sub)}.scroll{flex:1;overflow:auto;padding:6px 18px 24px;min-height:0;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:#d7d9dd;background:#2c2f34;font-size:12px;font-weight:700;padding:7px 10px;border-radius:7px;margin-bottom:14px}h1{font-size:26px;line-height:1.28;letter-spacing:-.7px;margin:2px 0 12px;font-weight:800}p{font-size:15px;line-height:1.55;color:var(--sub);margin:0 0 18px}.hero{background:#202227;border:1px solid var(--line);border-radius:12px;min-height:142px;margin-bottom:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px 18px;gap:11px;text-align:center}.symbol{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#383b42;font-size:30px;font-weight:800}.hero-title{font-size:17px;font-weight:700}.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 15px;margin:0 0 16px}.sectiontitle{font-size:15px;font-weight:800;margin:0 0 12px}.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;font-size:14px;padding:6px 0}.kv span{color:var(--sub);font-size:13px}.kv b{font-size:14px;font-weight:750;max-width:63%;text-align:right;overflow-wrap:anywhere}.note{padding:14px;background:var(--panel2);border:1px solid #45474d;border-radius:10px;color:#dfe0e3;font-size:14px;line-height:1.6;margin:0 0 15px}.footer{flex-shrink:0;background:#101114;padding:10px 18px 8px;display:flex;flex-direction:column;gap:10px}.cta{min-height:52px;width:100%;padding:12px 14px;border:1px solid #c9cbd0;border-radius:8px;background:var(--action);color:var(--actiontxt);font-size:16px;font-weight:800;text-align:center}.cta.alt{background:#27292e;color:#f4f4f5;border-color:#46494f;font-size:14px;font-weight:700}.cta.disabled{background:#414249;color:#b6b9be;border-color:#414249}.gesture{flex-shrink:0;min-height:22px;display:flex;align-items:center;justify-content:center}.gesture span{height:4px;width:108px;border-radius:20px;background:#f4f5f5}.code{display:block;background:#111214;border:1px solid #55575b;border-radius:6px;padding:11px;font-size:18px;letter-spacing:3px;margin:12px 0;font-weight:800}.hint{font-size:12px;color:var(--sub);margin:0 0 12px}.danger .hero{border-color:#7e4242}.danger .eyebrow{color:#ffbebd;background:#422b2d}.denied .hero,.expired .hero{border-color:#6b5050}.success .hero{border-color:#385d48}.success .eyebrow{color:#c7e4d0;background:#2b4133}.matching .kv{min-height:58px}.matching-error .kv:nth-child(4){color:#f1b6b4;background:#302123;padding:0 6px}.lobby-host .cta:not(.alt){background:#42434a;color:#ddd;border-color:#42434a}.large h1{font-size:37px}.large p{font-size:23px}.large .sectiontitle{font-size:23px}.large .kv{min-height:75px}.large .kv span,.large .kv b{font-size:21px}.large .note{font-size:22px}.large .cta{font-size:22px;min-height:64px}.large .hero{min-height:185px}.large .eyebrow{font-size:19px}.foldable{max-width:620px;margin:auto}.foldableGrid{display:grid;grid-template-columns:148px minmax(0,1fr);gap:13px}.sideMenu{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px}.sideMenu div{padding:12px 4px;font-size:13px}.sideMenu div.on{background:#303239;border-radius:6px}.foldable .panel{margin-bottom:12px}.foldable .scroll{padding-bottom:12px}.foldable .hero{min-height:100px;padding:8px;margin-bottom:12px}.foldable .symbol{width:46px;height:46px}.foldable .hero-title{font-size:14px}.foldable h1{font-size:18px}.foldable p{font-size:12px}.foldable .kv{min-height:43px}.foldable .footer{padding-top:6px}.foldable .cta{min-height:48px}.foldable .note{font-size:12px}@media(max-width:599px){.foldableGrid{grid-template-columns:minmax(0,1fr)}.foldable .sideMenu{display:none}}@media(max-width:380px){h1{font-size:23px}.top{min-height:60px}.hero{min-height:110px;padding:12px}.panel{padding:10px 12px}.footer{gap:6px}.kv{min-height:45px}.cta{min-height:50px}.note{font-size:13px;padding:10px}}</style></head><body><main class="device" id="app"></main><script>const states=[{"id":"C01","name":"초대받은 사람","source":"S05","icon":"✉","stage":"가입 전","title":"금요일 게임방에 초대받았어요","subtitle":"카카오톡에서 받은 초대 링크를 확인했습니다.","info":[["방 이름","금요일 게임방"],["현재 멤버","5명"],["방장","민지"],["초대 만료","2시간 30분 후"]],"notice":"가입 승인 방식입니다. 로그인 후 방장에게 참여를 요청할 수 있습니다.","primary":"Google 로그인 후 참여 요청","secondary":"다음에 하기","kind":"invite"},{"id":"C02","name":"가입 승인 대기","source":"S05","icon":"◷","stage":"승인 대기","title":"방장의 승인을 기다리고 있어요","subtitle":"참여 요청이 정상 접수되었습니다.","info":[["요청한 방","금요일 게임방"],["요청 상태","방장 확인 중"],["요청 시간","오늘 오후 2:10"]],"notice":"승인되면 앱 알림에서 알려드립니다. 승인 전에는 대화와 게임 기록을 볼 수 없습니다.","primary":"내 방으로 이동","secondary":"참여 요청 취소","kind":"pending"},{"id":"C03","name":"가입 거절 안내","source":"S05","icon":"!","stage":"참여 불가","t
