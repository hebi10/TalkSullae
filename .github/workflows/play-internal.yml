name: Play internal-testing guarded publisher

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/play-internal.yml'
      - 'scripts/ops05/**'
      - 'scripts/release/*play_testing_promotion.py'
      - 'scripts/release/*check_firebase_callables.py'
      - 'scripts/release/play_internal.py'
      - 'scripts/release/test_play_internal.py'
      - 'scripts/release/check_internal_readiness.py'
      - 'scripts/release/test_check_internal_readiness.py'
  workflow_dispatch:
    inputs:
      ops01_release_approved:
        description: 'Approve Play changes only after final planned work and QA'
        type: boolean
        required: true
        default: false
      mode:
        description: 'Check tracks, build only, deploy internally, or deploy and promote to closed'
        required: true
        default: check
        type: choice
        options: [check, build, deploy, deploy-and-promote]
      closed_track:
        description: 'Exact existing closed track ID; defaults to the PLAY_CLOSED_TRACK variable'
        type: string
        required: false
      closed_promotion_approved:
        description: 'Approve promotion of this same internal AAB to the selected closed track'
        type: boolean
        default: false
      firebase_compatibility_verified:
        description: 'Verify production Firebase compatibility for this release and installed clients before approving'
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: talksullae-play-publisher
  queue: max

jobs:
  guard-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify internal-only track and release safety rules
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit protected config presence without printing secret values
        id: readiness
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/release/check_internal_readiness.py --report play-internal-readiness.json
      - name: Authenticate Workload Identity for read-only Play preflight
        if: steps.readiness.outputs.can_check_play == 'true' && steps.readiness.outputs.auth_method == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate service account for read-only Play preflight
        if: steps.readiness.outputs.can_check_play == 'true' && steps.readiness.outputs.auth_method == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Discover existing internal track and verify version (no release)
        if: steps.readiness.outputs.can_check_play == 'true'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: |
          python3 scripts/release/play_internal.py check --track auto \
            --version-code "${{ steps.readiness.outputs.version_code }}" --report play-internal-preflight.json
      - name: Save non-secret readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-play-internal-readiness
          path: |
            play-internal-readiness.json
            play-internal-preflight.json
          retention-days: 14
          if-no-files-found: ignore

  source:
    if: >-
      github.repository == 'hebi10/TalkSullae' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.verify.outputs.mode }}
      code: ${{ steps.verify.outputs.code }}
      version: ${{ steps.verify.outputs.version }}
      batch: ${{ steps.verify.outputs.batch }}
      closed-track: ${{ steps.verify.outputs.closed-track }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact main release source
        id: verify
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_APPROVED: ${{ inputs.ops01_release_approved }}
          CLOSED_APPROVED: ${{ inputs.closed_promotion_approved }}
          CLOSED_TRACK: ${{ inputs.closed_track || vars.PLAY_CLOSED_TRACK }}
          FIREBASE_VERIFIED: ${{ inputs.firebase_compatibility_verified }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Play testing deployment is forbidden from feature branches.' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo 'Signed Play actions require a manual workflow dispatch.' >&2
            exit 1
          fi
          MODE="$REQUESTED_MODE"
          case "$MODE" in check|build|deploy|deploy-and-promote) ;; *)
            echo 'Unrecognized testing release mode.' >&2; exit 1;; esac
          if [[ "$MODE" != "check" && "$REQUESTED_APPROVED" != "true" ]]; then
            echo 'Explicit release batch approval is required before signed build or upload.' >&2
            exit 1
          fi
          if [[ "$MODE" == deploy || "$MODE" == deploy-and-promote ]]; then
            if [[ "$FIREBASE_VERIFIED" != true ]]; then
              echo 'Verify the operating Firebase backend before publishing the app.' >&2
              exit 1
            fi
          fi
          if [[ "$MODE" == deploy-and-promote && "$CLOSED_APPROVED" != true ]]; then
            echo 'Explicit approval of closed testing promotion is required.' >&2
            exit 1
          fi
          if [[ "$MODE" == deploy-and-promote ]]; then
            if [[ ! "$CLOSED_TRACK" =~ ^[a-z][a-z0-9._-]{0,49}$ ]]; then
              echo 'Select an existing closed track ID. Check mode can list the candidates.' >&2
              exit 1
            fi
            echo "closed-track=$CLOSED_TRACK" >> "$GITHUB_OUTPUT"
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$actual" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'The selected main source has changed.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from verify_aab import version_from_source
          code, name = version_from_source('app/build.gradle.kts')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('code=' + str(code) + '\n')
              stream.write('version=' + name + '\n')
          print('Source version:', name, 'code:', code)
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "batch=$(TZ=Asia/Seoul date +%F)-talksullae" >> "$GITHUB_OUTPUT"

      - name: Verify exact source Android and release-policy CI
        if: steps.verify.outputs.mode == 'deploy' || steps.verify.outputs.mode == 'deploy-and-promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in android.yml ops08-final-policy.yml; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&branch=main&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))] | .[0] | select(.) | [.head_sha, .conclusion] | join(" ")')"
            if [[ "$result" != "$GITHUB_SHA success" ]]; then
              echo "Latest main CI must pass for $workflow before Play publishing." >&2
              exit 1
            fi
          done

      - name: Probe production Firebase callable routing before Play publishing
        if: steps.verify.outputs.mode == 'deploy' || steps.verify.outputs.mode == 'deploy-and-promote'
        run: python3 scripts/release/check_firebase_callables.py

  qa:
    needs: source
    if: needs.source.outputs.mode != 'check'
    uses: ./.github/workflows/qa-2d.yml

  play-preflight:
    needs: source
    if: needs.source.outputs.mode != 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check explicit internal-track and authentication configuration
        id: auth-method
        env:
          WIF_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_INTERNAL_TRACK: auto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/release')
          from play_internal import track_name
          track_name(os.environ.get('PLAY_INTERNAL_TRACK',''))
          PY
          if [[ -n "$WIF_PROVIDER" && -n "$WIF_SA" ]]; then
            echo 'method=wif' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PLAY_JSON" ]]; then
            echo 'method=json' >> "$GITHUB_OUTPUT"
          else
            echo 'No authorized Google Play service account or Workload Identity is configured.' >&2
            exit 1
          fi
      - name: Authenticate with approved WIF identity
        if: steps.auth-method.outputs.method == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate with private service account JSON
        if: steps.auth-method.outputs.method == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: List possible closed track IDs without changing Play
        if: needs.source.outputs.mode == 'check'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: python3 scripts/release/play_testing_promotion.py inspect
      - name: Check Play app and internal track; require an existing track in deploy mode
        env:
          PLAY_INTERNAL_TRACK: auto
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          RELEASE_MODE: ${{ needs.source.outputs.mode }}
          RELEASE_VERSION_CODE: ${{ needs.source.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RELEASE_MODE" == deploy || "$RELEASE_MODE" == deploy-and-promote ]]; then
            extra+=(--require-existing-qa --version-code "$RELEASE_VERSION_CODE")
          fi
          python3 scripts/release/play_internal.py check --track "$PLAY_INTERNAL_TRACK" \
            "${extra[@]}" --report play-preflight.json
      - name: Check the exact closed target before internal publishing
        if: needs.source.outputs.mode == 'deploy-and-promote'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          BATCH_ID: ${{ needs.source.outputs.batch }}
          VERSION_CODE: ${{ needs.source.outputs.code }}
          CLOSED_TRACK: ${{ needs.source.outputs.closed-track }}
          CLOSED_APPROVED: ${{ inputs.closed_promotion_approved }}
        run: python3 scripts/release/play_testing_promotion.py preflight
      - name: Archive safe preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-play-preflight
          path: play-preflight.json
          retention-days: 7
          if-no-files-found: ignore

  signed-aab:
    needs: [source, qa]
    if: needs.source.outputs.mode != 'check' && needs.qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      TALK_PLAY_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      TALK_PLAY_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      TALK_PLAY_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android release SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore and validate original Play upload key and Firebase config
        run: python3 scripts/release/restore_secrets.py
      - name: Download SHA-256-pinned bundletool 1.18.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Build release signed with fixed Play upload key
        run: ./gradlew --no-daemon --max-workers=2 lintRelease bundleRelease --stacktrace
      - name: Verify AAB signer, exact package/version, OAuth and bundle integrity
        run: |
          mkdir -p play-dist
          python3 scripts/release/verify_aab.py --aab app/build/outputs/bundle/release/app-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --output play-dist/manifest.json
          cp app/build/outputs/bundle/release/app-release.aab play-dist/app-release.aab
          cp play/release-notes/internal-ko-KR.txt play-dist/ko-KR.txt
      - name: Upload provenance-checked signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-internal-signed-aab
          path: play-dist/
          retention-days: 14
          if-no-files-found: error
      - name: Clear private keys and Firebase config
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/talksullae-upload-keystore" app/google-services.json

  internal-publish:
    needs: [source, qa, signed-aab, play-preflight]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.ops01_release_approved == true &&
      inputs.firebase_compatibility_verified == true &&
      (needs.source.outputs.mode == 'deploy' ||
       (needs.source.outputs.mode == 'deploy-and-promote' && inputs.closed_promotion_approved == true)) &&
      needs.qa.result == 'success' &&
      needs.signed-aab.result == 'success' &&
      needs.play-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: play-internal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: talksullae-internal-signed-aab
          path: play-dist
      - name: Revalidate exact signed artifact before Play authorization
        env:
          VERSION_CODE: ${{ needs.source.outputs.code }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path('play-dist')
          meta = json.loads((output/'manifest.json').read_text(encoding='utf-8'))
          bundle = output/'app-release.aab'
          expected = os.environ.get('PLAY_UPLOAD_CERT_SHA256','').replace(':','').lower()
          assert len(expected) == 64 and all(c in '0123456789abcdef' for c in expected), 'Missing pinned signer'
          assert meta['package'] == 'com.hebi.talksullae', 'Wrong Play package'
          assert meta['sourceSha'] == os.environ['GITHUB_SHA'], 'Source changed after QA'
          assert meta['versionCode'] == int(os.environ['VERSION_CODE']), 'Version mismatch'
          assert meta['signerCertificateSha256'] == expected, 'Signer mismatch'
          assert all(meta[key] is True for key in ('signed', 'bundletoolValidated', 'firebaseConfigured')), 'Invalid provenance'
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == meta['aabSha256'], 'Artifact hash mismatch'
          assert (output/'ko-KR.txt').is_file(), 'Missing localized release notes'
          print('Source, signer, Firebase, version and signed bundle provenance verified')
          PY
      - name: Recheck Play authentication
        id: auth-method
        env:
          WIF_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "$WIF_PROVIDER" && -n "$WIF_SA" ]]; then
            echo 'method=wif' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PLAY_JSON" ]]; then
            echo 'method=json' >> "$GITHUB_OUTPUT"
          else
            echo 'Missing Google Play API authorization.' >&2
            exit 1
          fi
      - name: Authenticate WIF for Play internal track
        if: steps.auth-method.outputs.method == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate private JSON for Play internal track
        if: steps.auth-method.outputs.method == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Upload and commit ONLY approved internal testing release
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          PLAY_INTERNAL_TRACK: auto
          CODE: ${{ needs.source.outputs.code }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo 'main advanced before publishing; start from the latest verified source.' >&2
            exit 1
          fi
          python3 scripts/release/play_internal.py deploy --track "$PLAY_INTERNAL_TRACK" \
            --bundle play-dist/app-release.aab --version-code "$CODE" \
            --version "$VERSION" --notes-file play-dist/ko-KR.txt \
            --report play-result.json
      - name: Archive Play acceptance/readback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-play-internal-api-result
          path: play-result.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  closed-publish:
    needs: [source, internal-publish]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.ops01_release_approved == true &&
      inputs.closed_promotion_approved == true && inputs.firebase_compatibility_verified == true &&
      needs.source.outputs.mode == 'deploy-and-promote' &&
      needs.internal-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: play-closed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: talksullae-internal-signed-aab
          path: play-dist
      - uses: actions/download-artifact@v4
        with:
          name: talksullae-play-internal-api-result
      - name: Authenticate WIF from the authorized TalkSullae workflow
        if: vars.PLAY_WORKLOAD_IDENTITY_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != ''
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Authenticate approved Play service account JSON
        if: steps.wif.outcome == 'skipped'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Promote the completed internal release and verify closed track readback
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          BATCH_ID: ${{ needs.source.outputs.batch }}
          VERSION_CODE: ${{ needs.source.outputs.code }}
          CLOSED_TRACK: ${{ needs.source.outputs.closed-track }}
          CLOSED_APPROVED: ${{ inputs.closed_promotion_approved }}
        run: >-
          python3 scripts/release/play_testing_promotion.py promote
          --manifest play-dist/manifest.json --internal-receipt play-result.json
      - name: Archive closed testing commit and readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-play-closed-api-result-${{ github.run_attempt }}
          path: ops05-output/receipt.json
          if-no-files-found: ignore
          retention-days: 14
