name: DEX-04 TalkSullae offline replacement and navigation QA

on:
  push:
    branches: [qa/dex04-talksullae-replacement]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build exact main and preceding release with a shared disposable signer
        env:
          BASE_SHA: a0f375d9eb251bcaa8890e4d8c13eeb7307f1776
          MAIN_SHA: 219c8063b458aa5168f2850749593927caace4f7
        run: bash .github/scripts/dex04-talksullae-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: talksullae-dex04-offline-apks
          retention-days: 7
          if-no-files-found: error
          path: dex04-build/
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: talksullae-dex04-offline-apks
          path: dex04-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check signed replacement and isolated Android navigation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/dex04-talksullae-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talksullae-dex04-device-api${{ matrix.api }}
          retention-days: 14
          if-no-files-found: warn
          path: dex-device-output/
