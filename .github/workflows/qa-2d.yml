name: 2-D Android and Firebase multi-environment QA

on:
  pull_request:
    paths:
      - 'app/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/qa-2d.yml'
      - 'scripts/qa/**'
      - 'scripts/release/**'
      - 'scripts/dismiss_launcher_anr.py'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: talksullae-2d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase:
    name: Firestore security / transactional permission checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install backend dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Validate backend and input rules
        working-directory: functions
        run: npm run check && npm test
      - name: Run Firebase Emulator role and abuse tests
        run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-talksullae --only firestore "cd functions && npm run test:emulator"

  build:
    name: Build Android debug app and test runner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Play publisher safety and source versions
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Test safe handling of emulator system dialogs
        run: python3 -m unittest discover -s scripts/qa -p 'test_*.py' -v
      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, Lint and app / instrumentation APKs
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APKs for matrix
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-2d-test-apks
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload unit / lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-2d-build-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/
            app/build/test-results/

  device-matrix:
    name: ${{ matrix.name }} · UI/IME/contrast captures
    needs: [build, firebase]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: api29-phone
            api: 29
            profile: pixel_6
            size: 1080x2400
            density: 420
          - name: api35-phone
            api: 35
            profile: pixel_6
            size: 1080x2400
            density: 420
          - name: api36-phone
            api: 36
            profile: pixel_6
            size: 1080x2400
            density: 420
          - name: api36-tablet
            api: 36
            profile: pixel_tablet
            size: 1600x2560
            density: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: talksullae-2d-test-apks
          path: qa-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real UI tests and dark / light native captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            set -euo pipefail
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb install -r qa-build/debug/app-debug.apk
            adb install -r qa-build/androidTest/debug/app-debug-androidTest.apk
            mkdir -p "qa-captures/${{ matrix.name }}"
            adb shell am instrument -w -r -e class com.hebi.talksullae.MainNavigationTest,com.hebi.talksullae.RoomChatComposeTest com.hebi.talksullae.test/androidx.test.runner.AndroidJUnitRunner | tee "qa-captures/${{ matrix.name }}/instrumentation.txt"
            python3 scripts/qa/assert_instrumentation.py "qa-captures/${{ matrix.name }}/instrumentation.txt" 10
            python3 scripts/qa/capture_matrix.py --profile "${{ matrix.name }}" --size "${{ matrix.size }}" --output "qa-captures/${{ matrix.name }}"
            if [ "${{ matrix.name }}" = api36-phone ]; then python3 scripts/qa/export_play_store_captures.py play-store-captures; fi
      - name: Upload Play store UI captures with sample data
        if: matrix.name == 'api36-phone'
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-play-store-captures
          path: play-store-captures/
          retention-days: 14
          if-no-files-found: error
      - name: Upload genuine emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-2d-${{ matrix.name }}
          path: qa-captures/
          retention-days: 14
          if-no-files-found: error
