name: Android verification

on:
  push:
    branches: [main, feat/2a-compose-foundation]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, Lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-verification
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Upload unsigned-for-Play debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talksullae-debug-apk
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
